[project]
name = "cct-backend"
version = "0.1.0"
description = "Chess Calculation Trainer - API, domaine et orchestration Stockfish"
license = "GPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chess==1.11.2",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.16.0",
]

[tool.uv]
package = false


[tool.pytest.ini_options]
# Un test bloque laisse une pile d'appels dans la sortie au lieu d'un silence.
faulthandler_timeout = 120
