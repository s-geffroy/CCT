# Stack du VPS : developpement et tests uniquement (docs/decisions.md).
# L'application ne sert personne ici : aucun port publie, aucun label Traefik,
# 'exposure: none' dans app.yaml. Le compose de production Windows vit dans
# packaging/windows/compose.yaml.
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    networks:
      - internal
    environment:
      TZ: Europe/Paris
      APP_MODE: development
      # Le Host n'est verifie qu'au sens loopback : sur le VPS, seuls la
      # sonde interne et les tests parlent a l'API.
      ENGINE_THREADS: "2"
      ENGINE_HASH_MB: "128"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 256
    healthcheck:
      # 'live' : le processus repond. Le moteur est rapporte par /ready, sans
      # rendre le conteneur malade (les modes B/C marchent sans moteur).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s

  # Tests backend dans l'image finale + dependances de test :
  #   sudo appctl run tests
  #   sudo appctl run tests python -m app.engine.bench
  tests:
    profiles: [cli]
    # Reconstruit a chaque 'appctl run tests' : on teste toujours le code courant.
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 256

  # Outils de dev (Node, Python, uv) sur le depot monte, pour generer et mettre
  # a jour les lockfiles sans rien installer sur l'hote :
  #   sudo appctl run devtools sh -c 'cd backend && uv lock'
  # Reseau 'dev' : il faut Internet pour joindre les registres.
  devtools:
    profiles: [cli]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: devtools
    user: "1022:1023"
    networks:
      - dev
    volumes:
      - ./:/work
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 512

networks:
  internal:
    name: cct-internal
    external: true
  # Reseau sortant pour devtools seulement (registres npm / PyPI).
  dev:
    name: cct-dev

volumes:
  data:
    name: cct_data
