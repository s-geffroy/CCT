name: Container build and Windows release

# PR, push sur main, lancement manuel : tests seulement, rien n'est publie.
# Tag vX.Y.Z : tests, puis image GHCR par digest et release en BROUILLON
# (publication manuelle apres passage du paquet en Public, pull anonyme et
# validation Windows, cf. docs/release.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}  # chaque job declare le strict necessaire

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    name: tests (pytest, vitest, image finale, Playwright)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make ci
        run: make ci APP_VERSION=ci-${{ github.run_id }}
      - name: Rapports Playwright (en cas d'echec)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: tests/e2e/results
          retention-days: 7

  windows-scripts:
    name: scripts Windows (PSScriptAnalyzer, Pester, PowerShell 5.1)
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hors PowerShell Gallery (versions et empreintes figees, meme script que le
      # conteneur pwsh du VPS) : la galerie peut etre indisponible.
      - name: Modules epingles
        shell: powershell
        run: .\packaging\windows\tests\install-test-modules.ps1 -Destination "$env:RUNNER_TEMP\modules"
      - name: Analyse et tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:PSModulePath = "$env:RUNNER_TEMP\modules;" + $env:PSModulePath
          Import-Module Pester -RequiredVersion 5.7.1
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          & .\packaging\windows\tests\run.ps1
          exit $LASTEXITCODE

  publish:
    name: image GHCR (tags seulement)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-scripts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vars
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ github.ref_name }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
      - name: Smoke de l'image PUBLIEE, par digest
        shell: bash
        env:
          REF: ${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${{ steps.build.outputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'digest invalide'; exit 1; }
          docker pull "$REF"
          scripts/ci/smoke-image.sh "$REF" "$VERSION"

  release:
    name: release Windows en brouillon
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bundle Windows (ZIP + SHA256)
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 scripts/ci/make_windows_bundle.py "$VERSION" "$IMAGE" "$DIGEST" dist
      - name: Release en brouillon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Image : \`${IMAGE}@${DIGEST}\`

          **Brouillon.** Avant publication : paquet GHCR en Public, \`docker pull\` anonyme
          du digest ci-dessus, validation sur un PC Windows 11 (VALIDATION_WINDOWS.md).
          EOF
          gh release create "$VERSION" dist/* --draft --verify-tag --title "$VERSION" --notes-file notes.md --generate-notes
