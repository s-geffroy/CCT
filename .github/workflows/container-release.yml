name: Container build and Windows release

# PR, push sur main, lancement manuel : tests seulement, rien n'est publie.
# Tag vX.Y.Z : tests, puis image GHCR par digest et release en BROUILLON
# avec l'installateur Windows natif (publication manuelle apres validation sur
# un vrai PC Windows, cf. docs/release.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}  # chaque job declare le strict necessaire

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    name: tests (pytest, vitest, image finale, Playwright)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make ci
        run: make ci APP_VERSION=ci-${{ github.run_id }}
      - name: Rapports Playwright (en cas d'echec)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: tests/e2e/results
          retention-days: 7

  windows-scripts:
    name: scripts Windows (PSScriptAnalyzer, Pester, PowerShell 5.1)
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hors PowerShell Gallery (versions et empreintes figees, meme script que le
      # conteneur pwsh du VPS) : la galerie peut etre indisponible.
      - name: Modules epingles
        shell: powershell
        run: .\packaging\windows\tests\install-test-modules.ps1 -Destination "$env:RUNNER_TEMP\modules"
      - name: Analyse et tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:PSModulePath = "$env:RUNNER_TEMP\modules;" + $env:PSModulePath
          Import-Module Pester -RequiredVersion 5.7.1
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          & .\packaging\windows\tests\run.ps1
          exit $LASTEXITCODE

  # Lot 7 : installateur natif (Python embarque, Inno Setup), construit puis
  # REELLEMENT installe, demarre, utilise (Stockfish telecharge, analyse),
  # mis a jour et desinstalle sur ce Windows.
  windows-installer:
    name: installateur Windows natif (construction, installation, smoke)
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Interface (vite build)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Construction de l'installateur
        shell: powershell
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-ci.{0}', github.run_number) }}
        run: |
          .\packaging\windows\build.ps1 -Version $env:VERSION -FrontendDist frontend\dist -OutDir dist-native
          exit $LASTEXITCODE
      - name: Installation, demarrage, Stockfish, analyse, mise a jour, desinstallation
        shell: powershell
        run: |
          $setup = (Get-ChildItem dist-native\ChessCalculationTrainer-Setup-*.exe | Select-Object -First 1).FullName
          .\packaging\windows\tests\smoke-installed.ps1 -Setup $setup
          exit $LASTEXITCODE
      - name: Journal de l'application (en cas d'echec)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-logs
          path: |
            ~\AppData\Local\Chess Calculation Trainer\data\logs
            ~\AppData\Local\Temp\cct-setup.log
          retention-days: 7
      - name: Installateur (pour la release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist-native/
          retention-days: 7

  publish:
    name: image GHCR (tags seulement)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-scripts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vars
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ github.ref_name }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
      - name: Smoke de l'image PUBLIEE, par digest
        shell: bash
        env:
          REF: ${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${{ steps.build.outputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'digest invalide'; exit 1; }
          docker pull "$REF"
          scripts/ci/smoke-image.sh "$REF" "$VERSION"

  release:
    name: release Windows en brouillon
    needs: [publish, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installateur natif (setup.exe + SHA256)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: dist
      - name: Release en brouillon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Image Docker (developpement, serveur) : \`${IMAGE}@${DIGEST}\`

          **Windows : \`ChessCalculationTrainer-Setup-${VERSION}.exe\`** (sans Docker, sans droits
          administrateur ; empreinte dans le fichier \`.sha256\`). Installateur non signe :
          SmartScreen demande "Informations complementaires" puis "Executer quand meme".

          **Brouillon.** Avant publication : installation et fiche W01-W12 sur un vrai PC
          Windows 11 (packaging/windows/VALIDATION_WINDOWS.md, docs/release.md).
          EOF
          gh release create "$VERSION" dist/* --draft --verify-tag --title "$VERSION" --notes-file notes.md --generate-notes
