# Stack Windows de production (Docker Desktop, conteneurs Linux / WSL 2).
# Copie par l'installateur dans %LOCALAPPDATA%\ChessCalculationTrainer ; les
# valeurs viennent du .env cree a l'installation (IMAGE_REF par digest).
name: chess-calculation-trainer
services:
  app:
    image: ${IMAGE_REF:?IMAGE_REF doit etre defini dans .env}
    init: true
    ports:
      # Local uniquement : rien n'ecoute sur le reseau de la maison.
      - "127.0.0.1:${HOST_PORT:-8765}:8000"
    volumes:
      - trainer_data:/data
    environment:
      APP_DATA_DIR: /data
      # Ajustes a la memoire du PC par l'installateur (.env).
      ENGINE_THREADS: ${ENGINE_THREADS:-2}
      ENGINE_HASH_MB: ${ENGINE_HASH_MB:-128}
    cpus: ${APP_CPUS:-2.0}
    mem_limit: ${APP_MEMORY:-2g}
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 20s
    # /live : le processus repond. Le moteur peut etre indisponible sans que le
    # conteneur soit malade (les seances B/C restent possibles) ; l'installateur
    # lit /ready a part et le signale.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  trainer_data:
    name: chess-calculation-trainer-data
